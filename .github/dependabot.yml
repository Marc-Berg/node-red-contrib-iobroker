version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    ignore:
      # Node-RED (incl. 5.x) ships Express 4
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]